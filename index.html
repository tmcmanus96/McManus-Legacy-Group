document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 <div class=\"mlg-snap-row\"><dt>Primary NAICS<\/dt><dd>561720 · Janitorial Services<\/dd><\/div>\n        <\/dl>\n      <\/aside>\n    <\/div>\n  <\/section>\n\n  <section id=\"about\" class=\"mlg-sec\">\n    <div class=\"mlg-wrap mlg-about\">\n      <div>\n        <div class=\"mlg-eyebrow\">Who We Are<\/div>\n        <h2 class=\"mlg-h2\">A family-owned facilities support, project management, and IT services provider<\/h2>\n        <p class=\"mlg-body\">McManus Legacy Group, LLC is dedicated to supporting efficient day-to-day operations for public and private sector clients. We specialize in janitorial services, snow plowing, exterior maintenance, vending, IT support, and project management, with an emphasis on reliability, compliance, and responsive service delivery.<\/p>\n        <div class=\"mlg-chips\"><span class=\"mlg-chip\">SAM.gov Active &amp; Compliant<\/span><span class=\"mlg-chip\">Certified Small Business (CSB)<\/span><span class=\"mlg-chip\">Family Owned &amp; Operated<\/span><span class=\"mlg-chip\">Locally Responsive<\/span><\/div>\n      <\/div>\n      <div class=\"mlg-mv\">\n        <div class=\"mlg-mv-card\"><div class=\"mlg-mv-label\">Our Mission<\/div><p>To provide dependable, professional, and high-quality solutions while building lasting relationships with our clients and the communities we serve. We are committed to integrity, responsiveness, attention to detail, and delivering work that our clients can trust.<\/p><\/div>\n        <div class=\"mlg-mv-card\"><div class=\"mlg-mv-label\">Our Vision<\/div><p>To build McManus Legacy Group into a respected and trusted company known for excellence, reliability, and professionalism. We strive to create a lasting legacy through strong relationships, quality work, and a commitment to the people and communities we serve.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"services\" class=\"mlg-sec mlg-sec-gray mlg-sec-line\">\n    <div class=\"mlg-wrap\">\n      <div class=\"mlg-sechead\"><div><div class=\"mlg-eyebrow\">What We Do · Core Capabilities<\/div><h2 class=\"mlg-h2\">Seven services, one point of accountability<\/h2><\/div><p class=\"mlg-lede\">Scheduled or on demand, route-based or single site. We manage equipment, supplies, and quality control so your team doesn't have to.<\/p><\/div>\n      <div class=\"mlg-grid\">\n        <div class=\"mlg-card mlg-card-wide\">\n          <div><div class=\"mlg-card-num\">01<\/div><h3>Janitorial Services<\/h3><p>Routine and deep cleaning for commercial, office, and facilities environments, ensuring safe, sanitary, and compliant spaces.<\/p><\/div>\n          <ul class=\"mlg-list\"><li>Daily, weekly, and periodic cleaning schedules<\/li><li>Restroom, lobby, and common-area sanitation<\/li><li>Floor care and deep-cleaning projects<\/li><li>Supply restocking and trash and recycling removal<\/li><li>Quality inspections and documented follow-up<\/li><\/ul>\n        <\/div>\n        <div class=\"mlg-card mlg-card-wide\">\n          <div><div class=\"mlg-card-num\">02<\/div><h3>Snow Plowing &amp; Ice Management<\/h3><p>Seasonal snow removal and ice control to keep properties safe and accessible through winter conditions.<\/p><\/div>\n          <ul class=\"mlg-list\"><li>Parking lot, drive, and roadway plowing<\/li><li>Walkway and entrance clearing<\/li><li>Salting and de-icing before and after storms<\/li><li>Storm monitoring and responsive dispatch<\/li><li>Service logs for each weather event<\/li><\/ul>\n        <\/div>\n        <div class=\"mlg-card mlg-card-wide\">\n          <div><div class=\"mlg-card-num\">03<\/div><h3>Grounds &amp; Exterior Maintenance<\/h3><p>Exterior upkeep including grounds maintenance, property appearance support, and building-related exterior services.<\/p><\/div>\n          <ul class=\"mlg-list\"><li>Mowing, trimming, and seasonal lawn care<\/li><li>Landscape bed and shrub maintenance<\/li><li>Litter removal and exterior cleanup<\/li><li>Leaf and debris removal<\/li><li>Property appearance and curb-appeal support<\/li><\/ul>\n        <\/div>\n        <div class=\"mlg-card mlg-card-wide\">\n          <div><div class=\"mlg-card-num\">04<\/div><h3>Vending Services<\/h3><p>Snack and beverage stocking and restocking, machine placement, and route servicing for offices, break rooms, and government facilities.<\/p><\/div>\n          <ul class=\"mlg-list\"><li>Snack and beverage machine placement<\/li><li>Scheduled stocking and restocking routes<\/li><li>Inventory monitoring and refill planning<\/li><li>Machine cleaning and equipment upkeep<\/li><li>Prompt response to service requests<\/li><\/ul>\n        <\/div>\n        <div class=\"mlg-card mlg-card-wide\">\n          <div><div class=\"mlg-card-num\">05<\/div><h3>Project Management<\/h3><p>End-to-end planning and coordination that keeps projects on scope, on schedule, and on budget, with clear communication and documented results for every stakeholder.<\/p><\/div>\n          <ul class=\"mlg-list\"><li>Project planning, scoping, and scheduling<\/li><li>Task, milestone, and deliverable tracking<\/li><li>Stakeholder and vendor coordination<\/li><li>Risk, issue, and change management<\/li><li>Status reporting and project documentation<\/li><\/ul>\n        <\/div>\n        <div class=\"mlg-card mlg-card-wide\">\n          <div><div class=\"mlg-card-num\">06<\/div><h3>Facilities Support Coordination<\/h3><p>Hands-on operational oversight to ensure consistent service delivery, quality control, and timely response.<\/p><\/div>\n          <ul class=\"mlg-list\"><li>Single point of contact for service delivery<\/li><li>Vendor and service-schedule coordination<\/li><li>Site readiness and quality control checks<\/li><li>Work-order intake and timely response<\/li><li>Reporting and issue follow-through<\/li><\/ul>\n        <\/div>\n        <div class=\"mlg-card mlg-card-wide\">\n          <div><div class=\"mlg-card-num\">07<\/div><h3>IT Services &amp; Technical Support<\/h3><p>Responsive help desk and systems support for public and private sector offices, from everyday user issues to network and systems administration, backed by clear documentation and accountable follow-through.<\/p><\/div>\n          <ul class=\"mlg-list\"><li>Help desk and end-user support<\/li><li>Systems administration and networking<\/li><li>IT vendor transition and onboarding<\/li><li>Documentation, reporting, and ticket follow-through<\/li><\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"mlg-sec\">\n    <div class=\"mlg-wrap\">\n      <div class=\"mlg-sechead\"><div><div class=\"mlg-eyebrow\">Why McManus Legacy Group<\/div><h2 class=\"mlg-h2\">Built for contract performance<\/h2><\/div><\/div>\n      <div class=\"mlg-why\">\n        <div>\n          <div class=\"mlg-why-item\"><div class=\"mlg-why-n\">01<\/div><div><h3>Hands-On Operational Leadership<\/h3><p>Direct oversight of daily operations to ensure quality, accountability, and timely service delivery.<\/p><\/div><\/div>\n          <div class=\"mlg-why-item\"><div class=\"mlg-why-n\">02<\/div><div><h3>Reliable and Responsive Service<\/h3><p>Focused on consistency, clear communication, and meeting scheduling and performance expectations.<\/p><\/div><\/div>\n          <div class=\"mlg-why-item\"><div class=\"mlg-why-n\">03<\/div><div><h3>Compliance-Focused Approach<\/h3><p>Services delivered with attention to safety, documentation, and contract requirements.<\/p><\/div><\/div>\n          <div class=\"mlg-why-item\"><div class=\"mlg-why-n\">04<\/div><div><h3>Small Business Flexibility<\/h3><p>Ability to adapt quickly to changing needs while maintaining dependable service.<\/p><\/div><\/div>\n        <\/div>\n        <div class=\"mlg-panel-black\">\n          <h3>Operating Capabilities<\/h3>\n          <ul class=\"mlg-list\"><li>Scheduled and on-demand service execution<\/li><li>Route-based service coordination<\/li><li>Equipment and supply management<\/li><li>Quality control and site readiness checks<\/li><\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"clients\" class=\"mlg-sec mlg-sec-gray mlg-sec-line\">\n    <div class=\"mlg-wrap\">\n      <div class=\"mlg-sechead\"><div><div class=\"mlg-eyebrow\">Clients<\/div><h2 class=\"mlg-h2\">Who we serve<\/h2><\/div><\/div>\n      <div class=\"mlg-segs\">\n        <div class=\"mlg-seg\">Commercial office buildings<\/div>\n        <div class=\"mlg-seg\">Government and municipal facilities<\/div>\n        <div class=\"mlg-seg\">Residential and multi-family properties<\/div>\n        <div class=\"mlg-seg\">Parking lots and exterior common areas<\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"credentials\" class=\"mlg-sec\">\n    <div class=\"mlg-wrap\">\n      <div class=\"mlg-sechead\"><div><div class=\"mlg-eyebrow\">Credentials<\/div><h2 class=\"mlg-h2\">Registrations, certifications &amp; classification<\/h2><\/div><\/div>\n      <div class=\"mlg-cred\">\n        <div>\n          <table class=\"mlg-table\">\n            <thead><tr><th>Registration / Certification<\/th><th>Status<\/th><\/tr><\/thead>\n            <tbody>\n              <tr><td>SAM.gov Registration<\/td><td><span class=\"mlg-badge\">Active<\/span><\/td><\/tr>\n              <tr><td>Certified Small Business (CSB), State of Maryland<\/td><td><span class=\"mlg-badge\">Certified<\/span><\/td><\/tr>\n              <tr><td>Woman-Owned Small Business (WOSB)<\/td><td><span class=\"mlg-badge mlg-badge-wip\">In Progress<\/span><\/td><\/tr>\n            <\/tbody>\n          <\/table>\n          <div class=\"mlg-ids\"><div class=\"mlg-id\"><span>DUNS Number<\/span><b>141993930<\/b><\/div><div class=\"mlg-id\"><span>CAGE Code<\/span><b>183G9<\/b><\/div><\/div>\n        <\/div>\n        <div class=\"mlg-naics\">\n          <h3>NAICS Codes<\/h3>\n          <div class=\"mlg-naics-row\"><div class=\"mlg-naics-code\">561720<\/div><div class=\"mlg-naics-desc\">Janitorial Services<\/div><\/div>\n          <div class=\"mlg-naics-row\"><div class=\"mlg-naics-code\">561110<\/div><div class=\"mlg-naics-desc\">Office Administrative Services<\/div><\/div>\n          <div class=\"mlg-naics-row\"><div class=\"mlg-naics-code\">561730<\/div><div class=\"mlg-naics-desc\">Landscaping Services<\/div><\/div>\n          <div class=\"mlg-naics-row\"><div class=\"mlg-naics-code\">561790<\/div><div class=\"mlg-naics-desc\">Other Services to Buildings and Dwellings<\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"careers\" class=\"mlg-sec mlg-sec-gray mlg-sec-line\">\n    <div class=\"mlg-wrap\">\n      <div class=\"mlg-sechead\"><div><div class=\"mlg-eyebrow\">Careers<\/div><h2 class=\"mlg-h2\">Join our team<\/h2><\/div><\/div>\n      <div class=\"mlg-roles\">\n\n        <div class=\"mlg-role\" id=\"senior-technical-lead\">\n          <div class=\"mlg-tags\"><span class=\"mlg-tag\">1099 Contract · Part-time<\/span><span class=\"mlg-tag\">Hybrid · Chester, PA<\/span><\/div>\n          <h3>Senior Technical Lead<\/h3>\n          <p class=\"mlg-role-blurb\">Take back control of a client's IT systems from the outgoing vendor, secure them, and keep them running. Hands-on systems administration, networking, and vendor transition work.<\/p>\n          <dl class=\"mlg-facts\">\n            <div><dt>Location<\/dt><dd>Chester, PA (Delaware County). Must live within about 1 hour of Chester.<\/dd><\/div>\n            <div><dt>On-site<\/dt><dd>2–3 days a week in November, 1 day a week in December and January, then about 2 days a month. Remote the rest of the time.<\/dd><\/div>\n            <div><dt>Hours<\/dt><dd>About 15 a week through January, then about 5 a week. Occasional after-hours emergencies.<\/dd><\/div>\n            <div><dt>Start<\/dt><dd>November 2026<\/dd><\/div>\n          <\/dl>\n          <details class=\"mlg-jd\">\n            <summary><span class=\"mlg-open\">View full job description<\/span><span class=\"mlg-close\">Hide full job description<\/span><\/summary>\n            <div class=\"mlg-jd-body\">\n              <h4>What you'll do<\/h4>\n              <ol class=\"mlg-jd-list\">\n                <li>Collect and secure every admin login in a password vault the client owns (Bitwarden).<\/li>\n                <li>Move about 23 systems and accounts into the client's name: email and domain, internet, phones, Wi-Fi and VPN, door access and FOBs, cameras, payroll and housing software.<\/li>\n                <li>Restore staff access to door and FOB systems, and help fix resident door lock and key control problems.<\/li>\n                <li>Change all admin passwords, turn on multi-factor login, and remove the previous vendor's access.<\/li>\n                <li>Export the client's data from the previous vendor's systems, including work orders, files and help desk records.<\/li>\n                <li>Move email to Microsoft 365 and files to SharePoint.<\/li>\n                <li>Set up backups and security monitoring with our helpdesk partner.<\/li>\n                <li>Build an inventory of all computers, equipment and software licenses.<\/li>\n                <li>Manage user access in MRI (WinTen2+) housing software.<\/li>\n                <li>Write the technical parts of the security, incident response and disaster recovery plans.<\/li>\n                <li>Handle issues the help desk can't solve, and advise on security camera replacement.<\/li>\n              <\/ol>\n              <h4>What we expect<\/h4>\n              <ul class=\"mlg-list\">\n                <li>First-week safety tasks done within 5 business days<\/li>\n                <li>All systems in the client's name by the transition deadline<\/li>\n                <li>Every change documented in the client's system<\/li>\n                <li>Calm, professional communication with staff, union members and vendors<\/li>\n                <li>Strict confidentiality about client, resident and employee information<\/li>\n              <\/ul>\n              <h4>Required<\/h4>\n              <ul class=\"mlg-list\">\n                <li>7+ years in IT systems administration and networking<\/li>\n                <li>Hands-on Microsoft 365 administration (Exchange, Entra ID, Intune, SharePoint)<\/li>\n                <li>Network equipment, Wi-Fi, firewalls and VPNs<\/li>\n                <li>Door access (FOB) and security camera systems<\/li>\n                <li>Experience taking over IT from another vendor<\/li>\n                <li>Able to pass a background check<\/li>\n                <li>Own laptop and reliable transportation<\/li>\n              <\/ul>\n              <h4>Preferred<\/h4>\n              <ul class=\"mlg-list\">\n                <li>Public housing, government or nonprofit experience<\/li>\n                <li>MRI or other housing management software<\/li>\n                <li>Familiarity with HUD systems and privacy rules (EIV)<\/li>\n                <li>CompTIA Security+ or Network+, Microsoft 365 Administrator, or similar<\/li>\n              <\/ul>\n            <\/div>\n          <\/details>\n          <details class=\"mlg-apply\">\n            <summary><span class=\"mlg-open\">Apply Now<\/span><span class=\"mlg-close\">Close Application<\/span><\/summary>\n            <div class=\"mlg-embed\"><iframe id=\"JotFormIFrame-262955343440054\" src=\"https://form.jotform.com/262955343440054\" title=\"Senior Technical Lead application\" loading=\"lazy\"><\/iframe><\/div>\n            <div class=\"mlg-newtab\"><a href=\"https://form.jotform.com/262955343440054\" target=\"_blank\" rel=\"noopener\">Open this application in a new tab<\/a><\/div>\n          <\/details>\n        <\/div>\n\n        <div class=\"mlg-role\" id=\"help-desk-technician\">\n          <div class=\"mlg-tags\"><span class=\"mlg-tag\">1099 Contract · Part-time<\/span><span class=\"mlg-tag\">Hybrid · Chester, PA<\/span><\/div>\n          <h3>Help Desk Technician<\/h3>\n          <p class=\"mlg-role-blurb\">Be the friendly, reliable first point of contact when staff need IT help, resolving everyday issues and keeping every ticket moving.<\/p>\n          <dl class=\"mlg-facts\">\n            <div><dt>Location<\/dt><dd>Chester, PA (Delaware County). Must live within about 1 hour of Chester.<\/dd><\/div>\n            <div><dt>Schedule<\/dt><dd>On-site 1 day a week. Remote ticket support Monday–Friday, about 8:30 a.m.–4:30 p.m. On-site for hardware issues within 1 business day.<\/dd><\/div>\n            <div><dt>Hours<\/dt><dd>About 16–20 a week<\/dd><\/div>\n            <div><dt>Start<\/dt><dd>November 2026<\/dd><\/div>\n          <\/dl>\n          <details class=\"mlg-jd\">\n            <summary><span class=\"mlg-open\">View full job description<\/span><span class=\"mlg-close\">Hide full job description<\/span><\/summary>\n            <div class=\"mlg-jd-body\">\n              <h4>What you'll do<\/h4>\n              <ol class=\"mlg-jd-list\">\n                <li>Answer staff IT requests by ticket, email and phone.<\/li>\n                <li>Fix computer, printer, email, password and account issues.<\/li>\n                <li>Set up new staff with accounts and equipment, and remove access when staff leave (same or next business day).<\/li>\n                <li>Keep computers updated and report anything suspicious.<\/li>\n                <li>Help staff with Microsoft 365, MRI housing software log-ins and work order tablets.<\/li>\n                <li>Log every request and its resolution in the ticket system.<\/li>\n                <li>Help track staff security training.<\/li>\n                <li>Escalate bigger issues to the Senior Technical Lead.<\/li>\n              <\/ol>\n              <h4>What we expect<\/h4>\n              <ul class=\"mlg-list\">\n                <li>Every request logged in the ticket system<\/li>\n                <li>Patient, respectful service to all staff<\/li>\n                <li>Strict confidentiality about client, resident and employee information<\/li>\n              <\/ul>\n              <h4>Required<\/h4>\n              <ul class=\"mlg-list\">\n                <li>2+ years of help desk or IT support experience<\/li>\n                <li>Windows, Microsoft 365, printers and basic networking<\/li>\n                <li>Clear, patient communication with non-technical staff<\/li>\n                <li>Able to pass a background check<\/li>\n                <li>Reliable transportation<\/li>\n              <\/ul>\n              <h4>Preferred<\/h4>\n              <ul class=\"mlg-list\">\n                <li>Government, housing or nonprofit experience<\/li>\n                <li>CompTIA A+ or similar<\/li>\n                <li>Ticket system experience (Freshservice or similar)<\/li>\n              <\/ul>\n            <\/div>\n          <\/details>\n          <details class=\"mlg-apply\">\n            <summary><span class=\"mlg-open\">Apply Now<\/span><span class=\"mlg-close\">Close Application<\/span><\/summary>\n            <div class=\"mlg-embed\"><iframe id=\"JotFormIFrame-262954928585072\" src=\"https://form.jotform.com/262954928585072\" title=\"Help Desk Technician application\" loading=\"lazy\"><\/iframe><\/div>\n            <div class=\"mlg-newtab\"><a href=\"https://form.jotform.com/262954928585072\" target=\"_blank\" rel=\"noopener\">Open this application in a new tab<\/a><\/div>\n          <\/details>\n        <\/div>\n\n        <div class=\"mlg-role\" id=\"snow-plow-driver\">\n          <div class=\"mlg-tags\"><span class=\"mlg-tag\">Seasonal \u00b7 On-call<\/span><span class=\"mlg-tag\">Waldorf, MD &amp; surrounding areas<\/span><span class=\"mlg-tag\">No experience required<\/span><\/div>\n          <h3>Snow Plow Driver<\/h3>\n          <p class=\"mlg-role-blurb\">Keep commercial lots, apartment communities and roadways safe and open during winter storms. No plowing experience? We'll train anyone who is reliable and willing to work hard.<\/p>\n          <dl class=\"mlg-facts\">\n            <div><dt>Location<\/dt><dd>Based in Waldorf, MD, with client sites across Maryland and the DC area.<\/dd><\/div>\n            <div><dt>Schedule<\/dt><dd>On-call during snow and ice events, which can include overnight, weekend and holiday shifts.<\/dd><\/div>\n            <div><dt>Season<\/dt><dd>2026\u20132027 winter season<\/dd><\/div>\n            <div><dt>Type<\/dt><dd>W-2 employee or 1099 contractor<\/dd><\/div>\n          <\/dl>\n          <details class=\"mlg-jd\">\n            <summary><span class=\"mlg-open\">View full job description<\/span><span class=\"mlg-close\">Hide full job description<\/span><\/summary>\n            <div class=\"mlg-jd-body\">\n              <h4>What you'll do<\/h4>\n              <ol class=\"mlg-jd-list\">\n                <li>Plow assigned commercial, residential and government sites during snow events.<\/li>\n                <li>Operate salt spreaders and brine sprayers to prevent and treat ice.<\/li>\n                <li>Shovel and salt sidewalks, entrances and stairs by hand when needed.<\/li>\n                <li>Inspect your truck and equipment before and after each shift and report any issues.<\/li>\n                <li>Follow your route and log the sites you complete.<\/li>\n                <li>Drive safely in low-visibility, icy and overnight conditions.<\/li>\n              <\/ol>\n              <h4>Required<\/h4>\n              <ul class=\"mlg-list\">\n                <li>Valid driver's license<\/li>\n                <li>Able to respond when called out during storms<\/li>\n                <li>Able to lift up to 50 lbs<\/li>\n                <li>Willing to complete a driving record (MVR) check, background check and drug screening<\/li>\n              <\/ul>\n              <h4>Preferred (not required)<\/h4>\n              <ul class=\"mlg-list\">\n                <li>Snow plowing or commercial driving experience<\/li>\n                <li>DOT medical card or CDL<\/li>\n                <li>Experience with salt spreaders, brine sprayers or skid steers<\/li>\n                <li>Your own plow truck or equipment<\/li>\n              <\/ul>\n            <\/div>\n          <\/details>\n          <details class=\"mlg-apply\">\n            <summary><span class=\"mlg-open\">Apply Now<\/span><span class=\"mlg-close\">Close Application<\/span><\/summary>\n            <div class=\"mlg-embed\"><iframe id=\"JotFormIFrame-262983469595075\" src=\"https:\/\/form.jotform.com\/262983469595075\" title=\"Snow Plow Driver application\" loading=\"lazy\"><\/iframe><\/div>\n            <div class=\"mlg-newtab\"><a href=\"https:\/\/form.jotform.com\/262983469595075\" target=\"_blank\" rel=\"noopener\">Open this application in a new tab<\/a><\/div>\n          <\/details>\n        <\/div>\n\n      <\/div>\n      <p class=\"mlg-eeo\">McManus Legacy Group, LLC is an equal opportunity employer. Questions about these roles? Email <a href=\"mailto:info@mcmanuslegacygroup.com?subject=Careers%20question\">info@mcmanuslegacygroup.com<\/a>.<\/p>\n    <\/div>\n  <\/section>\n\n  <section id=\"contact\" class=\"mlg-sec mlg-contact\">\n    <div class=\"mlg-wrap mlg-contact-in\">\n      <div>\n        <div class=\"mlg-eyebrow\">How to Reach Us<\/div>\n        <h2 class=\"mlg-h2\">Contracting officers, primes, and property managers: let's talk.<\/h2>\n        <p class=\"mlg-contact-lede\">Send a request or call our team directly. We will walk through your site and requirements, and can provide our capability statement on request.<\/p>\n        <dl class=\"mlg-poc\">\n          <div><dt>Phone<\/dt><dd><a href=\"tel:+12403001781\">(240) 300-1781<\/a><\/dd><\/div>\n          <div><dt>Email<\/dt><dd><a href=\"mailto:info@mcmanuslegacygroup.com\">info@mcmanuslegacygroup.com<\/a><\/dd><\/div>\n          <div><dt>Web<\/dt><dd><a href=\"https://www.mcmanuslegacygroup.com\">www.mcmanuslegacygroup.com<\/a><\/dd><\/div>\n        <\/dl>\n      <\/div>\n      <div class=\"mlg-form\">\n        <h3>Request information<\/h3>\n        <form action=\"https://formsubmit.co/info@mcmanusle
